version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: realtime-scout-db
    environment:
      POSTGRES_DB: realtime_scout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
